<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelje by Duma</title>
<meta name="theme-color" content="#2b2118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelje">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<style>
html,body{margin:0;height:100%;background:#f7f1e8}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e8}
#uvod{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7f1e8;color:#2b2118;font-family:Georgia,'Times New Roman',serif;transition:opacity .45s ease;pointer-events:none}
#uvod.kraj{opacity:0}
#uvod b{font-weight:400;font-size:40px;letter-spacing:.08em}
#uvod i{font-size:20px;color:#b8955a;margin-top:2px}
#uvod span{position:relative;width:120px;height:2px;margin-top:28px;background:#eadfce;border-radius:2px;overflow:hidden}
#uvod span:after{content:'';position:absolute;left:-40%;top:0;width:40%;height:100%;background:#b8955a;animation:tok 1.2s ease-in-out infinite}
@keyframes tok{to{left:100%}}
</style>
</head>
<body>
<div id="uvod" aria-hidden="true"><b>ATELJE</b><i>by Duma</i><span></span></div>
<iframe id="app" allow="clipboard-write" title="Atelje by Duma"></iframe>
<script>
(function(){
  var ADRESA='https://script.google.com/macros/s/AKfycbzSYrS0QZU9ReN4i2Hp9GQ4iYsDSyJ5YFAVdZ-B1v8mj18JVj-CPzyBLq00U6DGo_PqgQ/exec';
  var u=document.getElementById('uvod'),f=document.getElementById('app'),gotovo=false,o=[];
  function kraj(){if(gotovo)return;gotovo=true;u.className='kraj';setTimeout(function(){u.style.display='none';},500);}
  try{var p=new URLSearchParams(location.search);['novo','klijent'].forEach(function(k){var v=p.get(k);if(v==='0'||v==='1')o.push(k+'='+v);});}catch(e){}
  f.addEventListener('load',function(){setTimeout(kraj,900);});
  setTimeout(kraj,9000);
  f.src=ADRESA+(o.length?'?'+o.join('&'):'');
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
